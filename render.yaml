services:
  - type: web
    name: wapromo-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wapromo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_SECURITY_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        value: https://wapromo.github.io
      - key: ADMIN_EMAIL
        value: admin@wapromo.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 20

databases:
  - name: wapromo-db
    plan: free
    databaseName: wapromo
    user: wapromo
